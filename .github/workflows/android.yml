name: Build Android Release APK

on:
  push:
    branches: [ main, pixel-physics-release-fix ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed release APK
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Verify release APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
