name: Build Android Release APK

on:
  push:
    branches: [ main, pixel-physics-release-fix ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed release APK
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Verify release APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Emulator launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            set -eu
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am force-stop com.wavesys.pixelphysics
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.wavesys.pixelphysics/com.wavesys.pixelphysics.MainActivity 2>&1 | tee /tmp/start.txt || true
            sleep 6

            adb logcat -d > /tmp/logcat.txt || true
            adb logcat -d -b crash > /tmp/crash.txt || true

            PID="$(adb shell pidof com.wavesys.pixelphysics | tr -d '\r')"
            echo "Pixel Physics PID: $PID"
            if [ -z "$PID" ]; then
              echo "=== START OUTPUT ==="
              cat /tmp/start.txt
              echo "=== CRASH BUFFER ==="
              cat /tmp/crash.txt
              echo "=== RELEVANT LOGCAT ==="
              grep -E "AndroidRuntime|FATAL EXCEPTION|com\.wavesys\.pixelphysics|Process: com\.wavesys\.pixelphysics" /tmp/logcat.txt | tail -n 200 || true
              exit 1
            fi

            adb shell dumpsys activity activities > /tmp/activities.txt
            grep -E "com\.wavesys\.pixelphysics/(\.MainActivity|com\.wavesys\.pixelphysics\.MainActivity)" /tmp/activities.txt

            if grep -q "com.wavesys.pixelphysics" /tmp/crash.txt; then
              echo "Pixel Physics produced an Android crash record"
              cat /tmp/crash.txt
              exit 1
            fi

            sleep 3
            PID2="$(adb shell pidof com.wavesys.pixelphysics | tr -d '\r')"
            echo "Pixel Physics PID after stability window: $PID2"
            test -n "$PID2"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
