name: Build Android Release APK

on:
  push:
    branches: [ main, pixel-physics-release-fix ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed release APK
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Verify release APK exists
        run: test -s app/build/outputs/apk/release/app-release.apk
      - name: Emulator launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.wavesys.pixelphysics
            START_OUTPUT="$(adb shell am start -W -n com.wavesys.pixelphysics/com.wavesys.pixelphysics.MainActivity)"
            echo "$START_OUTPUT"
            echo "$START_OUTPUT" | grep -q "Status: ok"
            sleep 3
            adb shell pidof com.wavesys.pixelphysics
            adb shell dumpsys activity activities | grep -q "com.wavesys.pixelphysics/.MainActivity"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pixel-physics-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
